name: Build Docker Images
on:
  push:
    paths:
      - '6months/project_2/hipaa_checklist_project/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies and run tests
        run: |
          pip install -r 6months/project_2/hipaa_checklist_project/backend/requirements.txt
          python 6months/project_2/hipaa_checklist_project/backend/manage.py test --noinput

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps and build
        run: |
          cd 6months/project_2/hipaa_checklist_project/frontend
          npm ci
          npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build local test image
        uses: docker/build-push-action@v5
        with:
          context: ./6months/project_2/hipaa_checklist_project
          file: ./6months/project_2/hipaa_checklist_project/Dockerfile
          push: false
          load: true
          tags: hipaa-checklist:test

      - name: Run container
        run: |
          docker run -d --name hipaa_app -p 8000:80 hipaa-checklist:test
          sleep 25

      - name: Test frontend root
        run: curl -f http://localhost:8000/

      - name: Test admin path
        continue-on-error: true
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8000/admin/)
          if [[ "$status" != "302" && "$status" != "200" ]]; then
            echo "::warning ::Unexpected status $status for /admin/"
          fi

      - name: Stop container
        if: always()
        run: docker rm -f hipaa_app || true

      - name: Build and push fullstack image
        uses: docker/build-push-action@v5
        with:
          context: ./6months/project_2/hipaa_checklist_project
          file: ./6months/project_2/hipaa_checklist_project/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hipaa-checklist:latest
            ghcr.io/${{ github.repository_owner }}/hipaa-checklist:${{ github.sha }} 