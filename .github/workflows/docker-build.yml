name: Build Docker Images
on:
  push:
    paths:
      - '6months/project_2/hipaa_checklist_project/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build fullstack image
        uses: docker/build-push-action@v5
        with:
          context: ./6months/project_2/hipaa_checklist_project
          file: ./6months/project_2/hipaa_checklist_project/Dockerfile
          push: false
          load: true
          tags: hipaa-checklist:test
      - name: Run container
        run: |
          docker run -d --name hipaa_app -p 8000:80 hipaa-checklist:test
          sleep 25
      - name: Test frontend root
        run: curl -f http://localhost:8000/
      - name: Test admin path
        continue-on-error: true
        run: |
          status=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8000/admin/)
          if [[ "$status" != "302" && "$status" != "200" ]]; then
            echo "::warning ::Unexpected status $status for /admin/"
          fi
      - name: Stop container
        if: always()
        run: docker rm -f hipaa_app || true 