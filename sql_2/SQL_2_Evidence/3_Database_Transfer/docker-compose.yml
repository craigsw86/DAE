version: '3.8'

services:
  # Django Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: hipaa_backend
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=hipaa_checklist.production_settings
      - FIELD_ENCRYPTION_KEY=1f2WjIy7cmJebkD-ywTrmct3Ms7-VuUjv7wleofoP54=
      - SECRET_KEY=tj3y6j#0l#6%*f=6fn%l=-^49=v_1_gbn-yb7)%%baff%_l@a4
      - WAITRESS_HOST=0.0.0.0
      - WAITRESS_PORT=8000
      - WAITRESS_THREADS=4
    volumes:
      - ./backend:/app/backend
      - database_data:/app/backend/db.sqlite3
      - logs_data:/app/logs
      - backups_data:/app/backups
    ports:
      - "8000:8000"
    networks:
      - hipaa_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hipaa_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-https.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./backend/staticfiles:/app/backend/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hipaa_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database Backup Service
  db_backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: hipaa_db_backup
    restart: "no"
    environment:
      - DJANGO_SETTINGS_MODULE=hipaa_checklist.production_settings
    volumes:
      - database_data:/app/backend/db.sqlite3
      - backups_data:/app/backups
    command: ["python", "backend/setup_database_security.py"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hipaa_network

  # Monitoring Service
  monitoring:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: hipaa_monitoring
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=hipaa_checklist.production_settings
    volumes:
      - database_data:/app/backend/db.sqlite3
      - logs_data:/app/logs
    command: ["python", "backend/monitor_waitress.py", "--interval", "60"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hipaa_network

volumes:
  database_data:
    driver: local
  logs_data:
    driver: local
  backups_data:
    driver: local

networks:
  hipaa_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
