# Nginx configuration for HIPAA Checklist Web Application
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # HTTP server (redirect to HTTPS)
    server {
        listen 80;
        server_name localhost;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL configuration (self-signed certificates for local dev)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Security headers for HIPAA compliance
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Serve React frontend (static files)
        location / {
            root /path/to/hipaa-checklist/frontend/build; # Update to your frontend build path
            index index.html;
            try_files $uri $uri/ /index.html; # React single-path app routing
        }

        # Proxy API reuqests Django/Gunicorn
        location /api/ {
            proxy_pass http://localhost:8000; # Gunicorn runs Django here
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve static Django files (e.g., admin CSS)
        location /static/ {
            alias /patj/to/hipaa-checklist/backend/statistic; # Update to your static path
        }
    }
}