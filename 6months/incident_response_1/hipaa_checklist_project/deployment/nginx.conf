server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://127.0.0.1:8000;  # Gunicorn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /path/to/backend/static/;
    }
}

# HTTPS block (add self-signed cert)
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /path/to/selfsigned.crt;
    ssl_certificate_key /path/to/selfsigned.key;
    # ... same locations
}