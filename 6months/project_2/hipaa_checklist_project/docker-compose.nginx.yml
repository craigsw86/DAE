version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: hipaa_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-https.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./backend/staticfiles:/app/backend/staticfiles:ro
    depends_on:
      - django
    networks:
      - hipaa_network
    restart: unless-stopped

  django:
    build: .
    container_name: hipaa_django
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./backend/db.sqlite3:/app/backend/db.sqlite3
    environment:
      - FIELD_ENCRYPTION_KEY=1f2WjIy7cmJebkD-ywTrmct3Ms7-VuUjv7wleofoP54=
      - SECRET_KEY=${SECRET_KEY}
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn hipaa_checklist.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    networks:
      - hipaa_network
    restart: unless-stopped

networks:
  hipaa_network:
    driver: bridge
