version: '3.8'

services:
  # Nginx for serving React build
  nginx-react:
    image: nginx:alpine
    container_name: hipaa_nginx_react
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-react.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-react-app.conf:/etc/nginx/conf.d/react-app.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./backend/staticfiles:/app/backend/staticfiles:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - django-backend
    networks:
      - hipaa_react_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django Backend
  django-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: hipaa_django_react
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=hipaa_checklist.settings
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - WAITRESS_HOST=0.0.0.0
      - WAITRESS_PORT=8000
      - WAITRESS_THREADS=4
    volumes:
      - ./backend:/app/backend
      - database_data:/app/backend/db.sqlite3
      - logs_data:/app/logs
      - backups_data:/app/backups
    ports:
      - "8000:8000"
    networks:
      - hipaa_react_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Development Server (optional)
  react-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hipaa_react_dev
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_ENVIRONMENT=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - hipaa_react_network
    profiles:
      - development

volumes:
  database_data:
    driver: local
  logs_data:
    driver: local
  backups_data:
    driver: local

networks:
  hipaa_react_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
