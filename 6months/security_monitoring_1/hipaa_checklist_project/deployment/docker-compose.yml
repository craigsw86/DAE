version: '3'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: hipaa_checklist
      POSTGRES_USER: hipaa_user
      POSTGRES_PASSWORD: securepass
  web:
    build: ../backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build: ../frontend
    command: npm start
    volumes:
      - ../frontend:/app
    ports:
      - "3000:3000"